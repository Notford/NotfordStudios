<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notford Studios</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>Notford Studios</h1>
    <nav>
      <a href="#services">Services</a>
      <a href="#works">Works</a>
      <a href="#appointments">Appointments</a>
    </nav>
  </header>

  <section id="services">
    <h2>Our Services</h2>
    <ul>
      <li>Photography</li>
      <li>Videography</li>
      <li>Graphic Design</li>
      <li>Modeling Management</li>
    </ul>
  </section>

  <section id="works">
    <h2>Our Works</h2>
    <div class="gallery">
      <img src="https://via.placeholder.com/300x200" alt="Sample Work 1">
      <img src="https://via.placeholder.com/300x200" alt="Sample Work 2">
      <img src="https://via.placeholder.com/300x200" alt="Sample Work 3">
    </div>
  </section>

  <section id="appointments">
    <h2>Book an Appointment</h2>
    <div id="message" class="message" hidden></div>
    <form id="bookingForm">
      <input type="text" id="clientName" placeholder="Full Name" required>
      <input type="email" id="clientEmail" placeholder="Email" required>
      <select id="serviceSelect" required>
        <option value="">Select Service</option>
        <option value="Photography">Photography</option>
        <option value="Videography">Videography</option>
        <option value="Graphic Design">Graphic Design</option>
        <option value="Modeling Management">Modeling Management</option>
      </select>
      <input type="date" id="date" required>
      <input type="time" id="time" required>
      <textarea id="notes" placeholder="Additional notes"></textarea>
      <button type="submit">Book Appointment</button>
    </form>
    <button id="manageBtn">Admin Portal</button>

    <div id="appointmentsPanel">
      <h3>Appointments</h3>
      <ul id="appointmentsList" hidden></ul>
      <div id="emptyState">No appointments found.</div>
    </div>
  </section>

  <footer>
    <p>&copy; 2025 Notford Studios</p>
  </footer>
</body>
</html>
